; Sabonglara production PHP settings (loaded after php.ini-production)

; Errors are logged, never shown to users.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; Do not advertise the PHP version.
expose_php = Off

memory_limit = 256M
max_execution_time = 300
upload_max_filesize = 20M
post_max_size = 25M

date.timezone = Asia/Manila

; OPcache. Code is bind-mounted, so check files for changes every 2 seconds.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
