; Sabonglara PHP-FPM pool (overrides the image's www pool)
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Hard stop for a runaway request (backups/restores need several minutes).
request_terminate_timeout = 900s

; Keep container environment variables (DB_HOST, PUSHER_*, ...) visible to PHP.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
